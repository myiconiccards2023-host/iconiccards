<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#f4f1ea"/>
  <rect x="25" y="25" width="550" height="400" fill="none" stroke="#d5cebf" stroke-width="1.5"/>
  <rect x="35" y="35" width="530" height="380" fill="none" stroke="#e8e3d8" stroke-width="0.75"/>
  <!-- Slab Outline -->
  <rect x="200" y="60" width="200" height="300" rx="6" fill="#ffffff" stroke="#1a1816" stroke-width="2"/>
  <!-- 4 Corner Screws -->
  <circle cx="215" cy="75" r="4" fill="#aba293" stroke="#1a1816" stroke-width="1"/>
  <circle cx="385" cy="75" r="4" fill="#aba293" stroke="#1a1816" stroke-width="1"/>
  <circle cx="215" cy="345" r="4" fill="#aba293" stroke="#1a1816" stroke-width="1"/>
  <circle cx="385" cy="345" r="4" fill="#aba293" stroke="#1a1816" stroke-width="1"/>
  <!-- Top Label -->
  <rect x="220" y="90" width="160" height="35" fill="#f6f4ed" stroke="#1a1816" stroke-width="1"/>
  <text x="300" y="105" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle" fill="#1a1816">HERITAGE ARCHIVE SLAB</text>
  <text x="300" y="118" font-family="monospace" font-size="7" text-anchor="middle" fill="#70685e">GRADE: ARCHIVAL PRESERVED</text>
  <!-- Enclosed Card -->
  <rect x="225" y="140" width="150" height="190" rx="2" fill="#faf8f2" stroke="#d5cebf" stroke-width="1"/>
  <rect x="235" y="150" width="130" height="85" fill="#ede8dc" stroke="#dfdad0" stroke-width="0.5"/>
  <line x1="235" y1="250" x2="365" y2="250" stroke="#1a1816" stroke-width="0.5"/>
  <text x="300" y="270" font-family="serif" font-size="10" text-anchor="middle" fill="#1a1816">MUSEUM GRADE SLAB</text>
  <text x="300" y="285" font-family="monospace" font-size="7" text-anchor="middle" fill="#70685e">UV FILTERING ACRYLIC</text>
  <text x="300" y="395" font-family="monospace" font-size="11" text-anchor="middle" fill="#70685e" letter-spacing="2">SCREWDOWN SLAB & PEDESTAL</text>
</svg>
